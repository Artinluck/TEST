name: Append donated VLESS config

on:
  repository_dispatch:
    types: [donate-config]

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Append config to file
        run: |
          echo "${{ github.event.client_payload.vless }}" >> configs.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add configs.txt
          git commit -m "Add donated node" || true
          git push
